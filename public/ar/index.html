<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SanskritiSetu MindAR AI Tracking</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 2 !important;
      }

      /* Scanning HUD Reticle */
      #scanning-hud {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        transition: opacity 0.3s ease;
      }
      .scan-frame {
        width: 68vw;
        height: 68vw;
        max-width: 290px;
        max-height: 290px;
        border: 2.5px solid #4c35de;
        border-radius: 20px;
        position: relative;
        box-shadow: 0 0 28px rgba(76, 53, 222, 0.45);
      }
      .scan-frame::before {
        content: '';
        position: absolute;
        top: -4px; left: -4px; right: -4px; height: 3px;
        background: linear-gradient(90deg, transparent, #10b981, transparent);
        animation: scan-laser 2s infinite ease-in-out;
      }
      @keyframes scan-laser {
        0%, 100% { top: 0; }
        50% { top: 100%; }
      }
      .hud-label {
        margin-top: 14px;
        background: rgba(20, 24, 40, 0.92);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 14px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      #target-status {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 40, 0.95);
        color: #10b981;
        padding: 6px 18px;
        border-radius: 20px;
        font-size: 0.78rem;
        font-weight: 800;
        display: none;
        align-items: center;
        gap: 6px;
        z-index: 101;
        border: 1px solid rgba(16, 185, 129, 0.5);
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
      }
    </style>

    <script>
      // Component to automatically scale and center the 3D model onto the target plane
      AFRAME.registerComponent('auto-fit-model', {
        schema: { size: { type: 'number', default: 0.85 } },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const targetSize = this.data.size;
              const scale = targetSize / maxDim;
              this.el.setAttribute('scale', `${scale} ${scale} ${scale}`);
            }

            console.log('✅ Model successfully loaded and normalized to target:', size);
          });
        }
      });
    </script>
  </head>

  <body>
    <!-- Scanning HUD -->
    <div id="scanning-hud">
      <div class="scan-frame"></div>
      <div class="hud-label">Point camera at target photograph</div>
    </div>

    <!-- Status Pill -->
    <div id="target-status">
      <span>● Target Locked (6-DoF AR Active)</span>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./assets/asset.glb"></a-asset-item>
      </a-assets>

      <!-- Ambient & Directional Lighting for photorealistic relief -->
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.8"></a-entity>
      <a-entity light="type: directional; color: #FFF7ED; intensity: 2.4" position="1 4 3"></a-entity>
      <a-entity light="type: directional; color: #CFD8DC; intensity: 0.9" position="-2 -1 1"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- Target Frame Ground Anchor Indicator -->
        <a-plane
          position="0 0 0"
          width="1.0"
          height="1.0"
          material="color: #4c35de; transparent: true; opacity: 0.15; side: double"
        ></a-plane>

        <!-- 3D Monument Anchored & Auto-Fitted to Target Image -->
        <a-gltf-model
          id="model-entity"
          rotation="90 0 0"
          position="0 0 0.1"
          src="#monumentModel"
          auto-fit-model="size: 0.85"
          animation-mixer="loop: repeat"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#ar-target');
      const hud = document.querySelector('#scanning-hud');
      const statusPill = document.querySelector('#target-status');

      target.addEventListener('targetFound', () => {
        hud.style.opacity = '0';
        statusPill.style.display = 'flex';
      });

      target.addEventListener('targetLost', () => {
        hud.style.opacity = '1';
        statusPill.style.display = 'none';
      });
    </script>
  </body>
</html>
