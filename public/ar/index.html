<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SanskritiSetu MindAR</title>
    <!-- MindAR Image with A-Frame 1.4.2 (Stable release required for MindAR camera feed) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      /* Force MindAR video feed to be visible */
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }

      /* Force A-Frame canvas to be transparent above video */
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-color: transparent !important;
        z-index: 2 !important;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      embedded
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./assets/asset.glb"></a-asset-item>
      </a-assets>

      <!-- Ambient & Directional Lighting -->
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.8"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 2.2" position="1 4 2"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Semi-transparent overlay plane -->
        <a-plane
          color="#4c35de"
          opacity="0.3"
          position="0 0 0"
          height="0.75"
          width="1"
          rotation="0 0 0"
        ></a-plane>

        <!-- 3D Monument anchored on top of target -->
        <a-gltf-model
          rotation="90 0 0"
          position="0 0 0.1"
          scale="0.00000166 0.00000166 0.00000166"
          src="#monumentModel"
          animation-mixer="loop: repeat"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
