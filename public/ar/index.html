<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SanskritiSetu MindAR 3D</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
      }
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-color: transparent !important;
        z-index: 2 !important;
      }
    </style>
    <script>
      // Component to center the model's pivot exactly at (0,0,0) and scale to target
      AFRAME.registerComponent('auto-center-fit', {
        schema: { size: { type: 'number', default: 0.75 } },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            // 1. Calculate true 3D bounding box
            const box = new THREE.Box3().setFromObject(mesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // 2. Re-center mesh geometry directly over the target image center (0,0,0)
            mesh.position.x = -center.x;
            mesh.position.y = -center.y;
            mesh.position.z = -center.z + (size.z / 2);

            // 3. Proportional scale normalized to 0.75 of target width
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const s = this.data.size / maxDim;
              this.el.setAttribute('scale', `${s} ${s} ${s}`);
            }

            console.log('✅ Model centered at target pivot:', { center, size });
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 1; missTolerance: 80;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./asset.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.8"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 2.4" position="1 4 3"></a-entity>
      <a-entity light="type: directional; color: #CFD8DC; intensity: 1.0" position="-2 -1 1"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Monument perfectly centered and normalized on target image -->
        <a-gltf-model
          rotation="90 0 0"
          position="0 0 0"
          src="#monumentModel"
          auto-center-fit="size: 0.75"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
