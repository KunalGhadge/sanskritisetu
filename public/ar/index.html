<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SanskritiSetu MindAR AI Tracking</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      /* Scanning Reticle HUD */
      #scanning-hud {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        transition: opacity 0.3s ease;
      }
      .scan-frame {
        width: 65vw;
        height: 65vw;
        max-width: 280px;
        max-height: 280px;
        border: 2px solid rgba(76, 53, 222, 0.85);
        border-radius: 20px;
        position: relative;
        box-shadow: 0 0 24px rgba(76, 53, 222, 0.4);
      }
      .scan-frame::before {
        content: '';
        position: absolute;
        top: -4px; left: -4px; right: -4px; height: 3px;
        background: linear-gradient(90deg, transparent, #10b981, transparent);
        animation: scan-laser 2s infinite ease-in-out;
      }
      @keyframes scan-laser {
        0%, 100% { top: 0; }
        50% { top: 100%; }
      }
      .hud-label {
        margin-top: 14px;
        background: rgba(20, 24, 40, 0.9);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 6px 14px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      #target-status {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 40, 0.9);
        color: #10b981;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 800;
        display: none;
        align-items: center;
        gap: 6px;
        z-index: 101;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }
    </style>
  </head>

  <body>
    <!-- Scanning HUD Overlay -->
    <div id="scanning-hud">
      <div class="scan-frame"></div>
      <div class="hud-label">Point camera at target image</div>
    </div>

    <div id="target-status">
      <span>● Target Locked (6-DoF Tracking)</span>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./assets/asset.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- 3D Monument Anchored to Target Image -->
        <a-gltf-model
          id="model-entity"
          rotation="90 0 0"
          position="0 0 0.1"
          scale="0.00000166 0.00000166 0.00000166"
          src="#monumentModel"
          animation-mixer="loop: repeat"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#ar-target');
      const hud = document.querySelector('#scanning-hud');
      const statusPill = document.querySelector('#target-status');

      target.addEventListener('targetFound', () => {
        hud.style.opacity = '0';
        statusPill.style.display = 'flex';
      });

      target.addEventListener('targetLost', () => {
        hud.style.opacity = '1';
        statusPill.style.display = 'none';
      });
    </script>
  </body>
</html>
