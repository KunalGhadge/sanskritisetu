<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SanskritiSetu MindAR 3D</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
      }
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-color: transparent !important;
        z-index: 2 !important;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 1; missTolerance: 80;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./asset.glb"></a-asset-item>
      </a-assets>

      <!-- Ambient & Directional Lighting -->
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.8"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 2.4" position="1 4 3"></a-entity>
      <a-entity light="type: directional; color: #CFD8DC; intensity: 1.0" position="-2 -1 1"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Visual Target Overlay Confirmation -->
        <a-plane
          color="#4c35de"
          opacity="0.35"
          position="0 0 0"
          height="0.75"
          width="1"
          rotation="0 0 0"
        ></a-plane>

        <!-- 3D Stone Chariot Model: 65,534 vertex units scaled by 0.00001 = 0.65 units (65% width of target image) -->
        <a-gltf-model
          rotation="90 0 0"
          position="0 0 0.1"
          scale="0.00001 0.00001 0.00001"
          src="#monumentModel"
          animation-mixer="loop: repeat"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
