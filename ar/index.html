<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SanskritiSetu MindAR</title>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./assets/asset.glb"></a-asset-item>
      </a-assets>

      <!-- Ambient and directional lights -->
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.6"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 2.2" position="1 3 2"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Semi-transparent overlay plane from tutorial (shows target detection) -->
        <a-plane
          color="#4c35de"
          opacity="0.35"
          position="0 0 0"
          height="0.75"
          width="1"
          rotation="0 0 0"
        ></a-plane>

        <!-- 3D Monument anchored on top of target -->
        <a-gltf-model
          rotation="90 0 0"
          position="0 0 0.1"
          scale="0.00000166 0.00000166 0.00000166"
          src="#monumentModel"
          animation-mixer="loop: repeat"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
