<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SanskritiSetu MindAR 3D</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
      }
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-color: transparent !important;
        z-index: 2 !important;
      }
    </style>

    <script>
      AFRAME.registerComponent('chariot-model', {
        init: function () {
          const el = this.el;
          
          el.addEventListener('model-loaded', () => {
            const obj = el.getObject3D('mesh');
            if (!obj) return;

            // Ensure materials are rendered double-sided with proper lighting
            obj.traverse((child) => {
              if (child.isMesh && child.material) {
                child.material.side = THREE.DoubleSide;
                child.material.needsUpdate = true;
              }
            });

            // 1. Calculate true bounding box
            const bbox = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            bbox.getSize(size);
            bbox.getCenter(center);

            console.log('✅ Chariot Loaded BBox Size:', size);
            console.log('✅ Chariot Loaded BBox Center:', center);

            // 2. Center mesh and place base on top of target plane
            obj.position.x = -center.x;
            obj.position.y = -center.y;
            obj.position.z = -bbox.min.z;

            // 3. Proportional scale (fit to 65% of target width)
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scale = 0.65 / maxDim;
              el.setAttribute('scale', `${scale} ${scale} ${scale}`);
            }
          });

          el.addEventListener('model-error', (error) => {
            console.error('❌ Model load error:', error);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 1; missTolerance: 80;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <a-asset-item id="monumentModel" src="./asset.glb"></a-asset-item>
      </a-assets>

      <!-- Ambient & Directional Lights -->
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 2.0"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 2.5" position="1 4 3"></a-entity>
      <a-entity light="type: directional; color: #CFD8DC; intensity: 1.2" position="-2 -1 1"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Target Plate -->
        <a-plane
          color="#4c35de"
          opacity="0.3"
          position="0 0 0"
          height="0.75"
          width="1"
          rotation="0 0 0"
        ></a-plane>

        <!-- 3D Stone Chariot Model -->
        <a-gltf-model
          id="chariot"
          src="#monumentModel"
          chariot-model
          position="0 0 0.02"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
